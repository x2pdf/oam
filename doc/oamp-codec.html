<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OAMP 编解码</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --fg: #1c1917;
      --muted: #57534e;
      --card: #fffcf7;
      --line: #e7e0d4;
      --accent: #0f766e;
      --accent-fg: #f0fdfa;
      --danger: #b45309;
      --ok: #166534;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --fg: #f5f0e8;
        --muted: #a8a29e;
        --card: #292524;
        --line: #44403c;
        --accent: #2dd4bf;
        --accent-fg: #042f2e;
        --danger: #fbbf24;
        --ok: #86efac;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    h1 { font-size: 1.45rem; margin: 0 0 6px; font-weight: 650; }
    .lead { color: var(--muted); margin: 0 0 22px; font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: transparent;
      color: inherit;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 12px 0 4px;
    }
    select, button {
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      background: var(--card);
      color: inherit;
    }
    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
      font-weight: 600;
    }
    button.ghost { background: transparent; }
    .status { font-size: 0.86rem; color: var(--muted); min-height: 1.4em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
      word-break: break-all;
    }
    .images { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
      .images a {
        display: inline-block;
        max-width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
        font-size: 0.85rem;
        word-break: break-all;
      }
    kbd {
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--line);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>OAMP / mypayload 编解码</h1>
    <p class="lead">
      把用户上传前的 UTF-8 文本编码成当前上链的 OAMP calldata hex，
      或把链上 hex 解回 mypayload 明文（支持文本、内联图片和 &lt;a&gt; 附件）。加密消息（AES-GCM）无法在此解密。
    </p>

    <div class="card">
      <label for="input">输入（文本或 hex）</label>
      <textarea id="input" placeholder="明文，或 0x4f414d50… / 4f414d50…"></textarea>
      <div class="row">
        <label for="msgType" style="margin:0">编码类型</label>
        <select id="msgType" title="明文上链信封 TYPE">
          <option value="0">广播 BROADCAST（A → 零地址）</option>
          <option value="2">明文 P2P（A → B）</option>
        </select>
        <button class="primary" id="encodeBtn" type="button">编码 → OAMP hex</button>
        <button class="primary" id="decodeBtn" type="button">解码 → 明文</button>
        <button class="ghost" id="copyBtn" type="button">复制结果</button>
        <button class="ghost" id="swapBtn" type="button">结果填入输入</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <label for="output">结果</label>
      <textarea id="output" readonly placeholder="编码或解码结果会显示在这里"></textarea>
      <div class="meta" id="meta"></div>
      <div class="images" id="images"></div>
    </div>
  </main>

  <script>
    const MAGIC = [0x4f, 0x41, 0x4d, 0x50];
    const VERSION = 1;
    const RESERVED = 0x00;
    const HEADER_LEN = 8;
    const NONCE_LEN = 12;
    const ENVELOPE_LEN = HEADER_LEN + NONCE_LEN;
    const TYPE_NAMES = { 0: "BROADCAST", 1: "PERSONAL", 2: "P2P" };
    const CRYPTO_NAMES = { 0: "NONE", 1: "AES_256_GCM" };

    const $input = document.getElementById("input");
    const $output = document.getElementById("output");
    const $status = document.getElementById("status");
    const $meta = document.getElementById("meta");
    const $images = document.getElementById("images");
    const $msgType = document.getElementById("msgType");

    function escapeHtml(str) {
      return str.replace(/[&<>"]/g, (tag) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[tag] || tag));
    }

    function unescapeHtml(str) {
      return str.replace(/&(amp|lt|gt|quot);/g, (_, tag) => ({
        amp: "&",
        lt: "<",
        gt: ">",
        quot: '"',
      }[tag] || _));
    }

    function payloadEncode(items) {
      let html = "<html>";
      for (const item of items) {
        if (item.type === "text") {
          html += `<pre>${escapeHtml(item.content)}</pre>`;
        } else if (item.type === "image") {
          const src = escapeHtml(item.data);
          const altAttr = item.alt ? ` alt="${escapeHtml(item.alt)}"` : "";
          html += `<img src="${src}"${altAttr}>`;
        } else if (item.type === "link") {
          if (!/^https?:\/\//i.test(item.href || "")) continue;
          let tag = `<a href="${escapeHtml(item.href)}" type="${escapeHtml(item.mime || "")}"`;
          if (item.arId) tag += ` data-ar-id="${escapeHtml(item.arId)}"`;
          if (item.download) tag += " download";
          tag += `>${escapeHtml(item.label || "")}</a>`;
          html += tag;
        }
      }
      html += "</html>";
      return new TextEncoder().encode(html);
    }

    function payloadDecode(data) {
      const html = typeof data === "string" ? data : new TextDecoder("utf-8").decode(data);
      if (!html) return [];
      if (!html.startsWith("<html>")) {
        return [{ type: "text", content: html }];
      }
      const items = [];
      const tagRegex = /<pre>(.*?)<\/pre>|<img\s+([^>]*?)>|<a\s+([^>]*?)>(.*?)<\/a>/gs;
      let match;
      while ((match = tagRegex.exec(html)) !== null) {
        const textContent = match[1];
        const imgTagBody = match[2];
        const aTagBody = match[3];
        const aInner = match[4];
        if (textContent !== undefined) {
          items.push({ type: "text", content: unescapeHtml(textContent) });
        } else if (imgTagBody !== undefined) {
          const srcMatch = imgTagBody.match(/src="([^"]+)"/);
          const altMatch = imgTagBody.match(/alt="([^"]+)"/);
          if (srcMatch) {
            items.push({
              type: "image",
              data: unescapeHtml(srcMatch[1]),
              alt: altMatch ? unescapeHtml(altMatch[1]) : undefined,
            });
          }
        } else if (aTagBody !== undefined) {
          const hrefMatch = aTagBody.match(/href="([^"]+)"/);
          if (!hrefMatch) continue;
          const href = unescapeHtml(hrefMatch[1]);
          if (!/^https?:\/\//i.test(href)) continue;
          const typeMatch = aTagBody.match(/\btype="([^"]+)"/);
          const arIdMatch = aTagBody.match(/data-ar-id="([^"]+)"/);
          items.push({
            type: "link",
            href,
            mime: typeMatch ? unescapeHtml(typeMatch[1]) : "application/octet-stream",
            label: unescapeHtml(aInner || ""),
            arId: arIdMatch ? unescapeHtml(arIdMatch[1]) : undefined,
            download: /\bdownload\b/i.test(aTagBody) || undefined,
          });
        }
      }
      return items;
    }

    function bytesToHex(bytes) {
      let hex = "0x";
      for (let i = 0; i < bytes.length; i++) {
        hex += bytes[i].toString(16).padStart(2, "0");
      }
      return hex;
    }

    function parseHexToBytes(raw) {
      let hex = String(raw).trim().replace(/\s+/g, "");
      if (hex.startsWith("0x") || hex.startsWith("0X")) hex = hex.slice(2);
      if (!hex) throw new Error("空 hex");
      if (hex.length % 2 !== 0) throw new Error("hex 长度为奇数");
      if (!/^[0-9a-fA-F]+$/.test(hex)) throw new Error("含有非十六进制字符");
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i++) {
        out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
      }
      return out;
    }

    function serializeMessage(type, crypto, nonce, payload) {
      const packet = new Uint8Array(ENVELOPE_LEN + payload.length);
      packet.set(MAGIC, 0);
      packet[4] = VERSION;
      packet[5] = type;
      packet[6] = crypto;
      packet[7] = RESERVED;
      packet.set(nonce, HEADER_LEN);
      packet.set(payload, ENVELOPE_LEN);
      return bytesToHex(packet);
    }

    function deserializeEnvelope(bytes) {
      if (bytes.length < ENVELOPE_LEN) {
        throw new Error("数据短于 OAMP 信封（至少 20 字节）");
      }
      for (let i = 0; i < 4; i++) {
        if (bytes[i] !== MAGIC[i]) throw new Error("不是 OAMP（MAGIC 应为 4f414d50）");
      }
      const version = bytes[4];
      if (version !== VERSION) throw new Error("不支持的 OAMP VERSION: " + version);
      if (bytes[7] !== RESERVED) throw new Error("RESERVED 必须为 0x00");
      const type = bytes[5];
      const crypto = bytes[6];
      if (!(type in TYPE_NAMES) || !(crypto in CRYPTO_NAMES)) {
        throw new Error("未知 TYPE/CRYPTO: " + type + "/" + crypto);
      }
      const valid = new Set(["0:0", "1:1", "2:0", "2:1"]);
      if (!valid.has(type + ":" + crypto)) {
        throw new Error("非法 (TYPE, CRYPTO) 组合: " + TYPE_NAMES[type] + " + " + CRYPTO_NAMES[crypto]);
      }
      return {
        type,
        crypto,
        nonce: bytes.slice(HEADER_LEN, ENVELOPE_LEN),
        payload: bytes.slice(ENVELOPE_LEN),
      };
    }

    function itemsToPlainText(items) {
      return items.map(item => {
        if (item.type === "text") return item.content;
        if (item.type === "image") {
          const name = item.alt ? ` [${item.alt}]` : "";
          return `[图片]${name} ${item.data.startsWith("data:") ? "(Base64 Data)" : item.data}`;
        }
        if (item.type === "link") {
          const label = item.label ? ` [${item.label}]` : "";
          const ar = item.arId ? ` (AR: ${item.arId})` : "";
          return `[链接/附件]${label}${ar} ${item.href} [${item.mime}]`;
        }
        return "";
      }).join("\n\n");
    }

    function setStatus(text, kind) {
      $status.textContent = text;
      $status.className = "status" + (kind ? " " + kind : "");
    }

    function renderImages(items) {
      $images.innerHTML = "";
      for (const item of items) {
        if (item.type === "image") {
          const container = document.createElement("div");
          container.style.cssText = "display:flex; flex-direction:column; gap:6px; border:1px solid var(--line); padding:8px; border-radius:10px;";

          const img = document.createElement("img");
          img.src = item.data;
          img.alt = item.alt || "image";
          img.style.maxWidth = "240px";
          img.style.maxHeight = "320px";
          img.style.borderRadius = "6px";
          container.appendChild(img);

          if (item.alt) {
            const span = document.createElement("span");
            span.textContent = item.alt;
            span.style.fontSize = "0.75rem";
            span.style.color = "var(--muted)";
            container.appendChild(span);
          }
          $images.appendChild(container);
        } else if (item.type === "link") {
          const a = document.createElement("a");
          a.href = item.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";

          let label = item.label || "未命名附件";
          if (item.arId) label = "📦 " + label;
          a.textContent = label;

          let title = `URL: ${item.href}\nMIME: ${item.mime}`;
          if (item.arId) title += `\nArweave ID: ${item.arId}`;
          if (item.download) title += "\n(建议下载)";
          a.title = title;

          if (item.download) a.setAttribute("download", "");
          $images.appendChild(a);
        }
      }
    }

    function encode() {
      const text = $input.value;
      if (!text) {
        setStatus("请先输入要上链的明文", "err");
        return;
      }
      const type = Number($msgType.value);
      const nonce = crypto.getRandomValues(new Uint8Array(NONCE_LEN));
      const payload = payloadEncode([{ type: "text", content: text }]);
      const hex = serializeMessage(type, 0, nonce, payload);
      $output.value = hex;
      renderImages([]);
      $meta.textContent =
        "TYPE=" + TYPE_NAMES[type] + " CRYPTO=NONE VERSION=1  payload=" + payload.length +
        " 字节  envelope=" + (ENVELOPE_LEN + payload.length) + " 字节  nonce=" + bytesToHex(nonce);
      setStatus("已编码为当前上链格式（mypayload HTML + OAMP v1 信封）。NONCE 每次随机，相同明文 hex 会不同。", "ok");
    }

    function decode() {
      let bytes;
      try {
        bytes = parseHexToBytes($input.value);
      } catch (e) {
        setStatus("hex 解析失败：" + e.message, "err");
        return;
      }

      try {
        const msg = deserializeEnvelope(bytes);
        if (msg.crypto !== 0) {
          $output.value = "";
          renderImages([]);
          $meta.textContent =
            "TYPE=" + TYPE_NAMES[msg.type] + " CRYPTO=" + CRYPTO_NAMES[msg.crypto] +
            "  payload=" + msg.payload.length + " 字节（密文，含 16 字节 tag）";
          setStatus("这是加密 OAMP，本页只处理 CRYPTO=NONE 的明文。", "err");
          return;
        }
        const items = payloadDecode(msg.payload);
        const text = itemsToPlainText(items);
        $output.value = text;
        renderImages(items);
        const imgCount = items.filter((i) => i.type === "image").length;
        const linkCount = items.filter((i) => i.type === "link").length;
        $meta.textContent =
          "TYPE=" + TYPE_NAMES[msg.type] + " CRYPTO=NONE VERSION=1  payload=" + msg.payload.length +
          " 字节  文本段=" + items.filter((i) => i.type === "text").length +
          "  图片=" + imgCount + "  附件=" + linkCount;
        setStatus(text || imgCount || linkCount ? "已解码为上传前明文（UTF-8 / mypayload）。" : "PAYLOAD 为空或无法解析出内容。", text || imgCount || linkCount ? "ok" : "err");
      } catch (e) {
        setStatus("OAMP 解码失败：" + e.message, "err");
      }
    }

    document.getElementById("encodeBtn").addEventListener("click", encode);
    document.getElementById("decodeBtn").addEventListener("click", decode);
    document.getElementById("copyBtn").addEventListener("click", async () => {
      if (!$output.value) {
        setStatus("没有可复制的结果", "err");
        return;
      }
      try {
        await navigator.clipboard.writeText($output.value);
        setStatus("已复制结果", "ok");
      } catch {
        $output.select();
        document.execCommand("copy");
        setStatus("已复制结果", "ok");
      }
    });
    document.getElementById("swapBtn").addEventListener("click", () => {
      if (!$output.value) return;
      $input.value = $output.value;
      setStatus("已将结果填入输入框", "ok");
    });
  </script>
</body>
</html>
