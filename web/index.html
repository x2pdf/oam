<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>OAM</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #1DA1F2;
      }
      #root {
        height: 100%;
      }
      /* Optional: simple center text or logo during loading */
      .loading-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-splash">OAM</div>
    </div>
  </body>
</html>
